<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Guilherme Tavares: Software Engineering · Go</title>
  <desc id="d">Janela de terminal com o comando whoami, o nome Guilherme Tavares, a área Software Engineering · Go e um trecho de código em Go descrevendo foco e stack.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .code { font-size: 13px; fill: #EDEDED; white-space: pre; }
    .kw { fill: #FF2E7E; }
    .ty { fill: #5B7FE0; }
    .st { fill: #9FB6F0; }
    .cm { fill: #8A8A8A; }
  </style>

  <!-- fundo jet black -->
  <rect width="1280" height="360" fill="#0A0A0A"/>

  <!-- janela do terminal -->
  <rect x="48" y="24" width="1184" height="312" rx="12" fill="#141414" stroke="#2A2A2A"/>
  <line x1="48" y1="60" x2="1232" y2="60" stroke="#2A2A2A"/>
  <circle cx="72" cy="42" r="6" fill="#FF2E7E"/>
  <circle cx="92" cy="42" r="6" fill="#2A52BE"/>
  <circle cx="112" cy="42" r="6" fill="#3A3A3A"/>
  <text x="136" y="46" class="mono" font-size="13" fill="#9A9A9A">guilherme@dev: ~/engenharia-de-software</text>

  <!-- coluna da esquerda -->
  <text x="84" y="118" class="mono" font-size="16"><tspan fill="#FF2E7E">$</tspan><tspan fill="#9A9A9A"> whoami</tspan></text>
  <text x="84" y="172" class="mono" font-size="44" font-weight="800" fill="#EDEDED" letter-spacing="-0.5">Guilherme Tavares</text>
  <rect x="84" y="188" width="120" height="4" rx="2" fill="#2A52BE"/>
  <text x="84" y="226" class="mono" font-size="22" font-weight="700" fill="#FF2E7E">Software Engineering · Go</text>
  <text x="84" y="258" class="sans" font-size="16" fill="#B5B5B5">Back-end · Dados · Cloud</text>
  <text x="84" y="298" class="mono" font-size="16" fill="#FF2E7E">$</text>
  <rect x="102" y="284" width="10" height="18" fill="#EDEDED">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- painel de código -->
  <rect x="660" y="78" width="536" height="242" rx="8" fill="#0A0A0A" stroke="#2A2A2A"/>
  <text class="mono code" xml:space="preserve">
    <tspan x="684" y="102" class="cm">// engineer.go</tspan>
    <tspan x="684" y="121"><tspan class="kw">type</tspan> <tspan class="ty">Engineer</tspan> <tspan class="kw">struct</tspan> {</tspan>
    <tspan x="684" y="140">    Name  <tspan class="ty">string</tspan></tspan>
    <tspan x="684" y="159">    Focus []<tspan class="ty">string</tspan></tspan>
    <tspan x="684" y="178">    Stack []<tspan class="ty">string</tspan></tspan>
    <tspan x="684" y="197">}</tspan>
    <tspan x="684" y="235"><tspan class="kw">var</tspan> me = <tspan class="ty">Engineer</tspan>{</tspan>
    <tspan x="684" y="254">    Name:  <tspan class="st">"Guilherme Tavares"</tspan>,</tspan>
    <tspan x="684" y="273">    Focus: []<tspan class="ty">string</tspan>{<tspan class="st">"backend"</tspan>, <tspan class="st">"dados"</tspan>, <tspan class="st">"cloud"</tspan>},</tspan>
    <tspan x="684" y="292">    Stack: []<tspan class="ty">string</tspan>{<tspan class="st">"Go"</tspan>, <tspan class="st">"Python"</tspan>, <tspan class="st">"TypeScript"</tspan>, <tspan class="st">"SQL"</tspan>},</tspan>
    <tspan x="684" y="311">}</tspan>
  </text>
</svg>
